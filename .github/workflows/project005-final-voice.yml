name: Build Project 005 Final Voice Replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project005-final-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Download exact source video
        run: |
          curl -L --fail --retry 3 \
            'https://d2jqrm6oza8nb6.cloudfront.net/datasets/1bb0efdd-e7fd-431e-b943-0551e351773c.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOWE5MTZjODBlOTI5MTE3ZiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDMwNjU2MH0.7ldWDpMdRSXbldmx37JgCTH90k_cN5Qpt84XiJGTCcs' \
            -o source.mp4

      - name: Download clean replacement narration
        run: |
          curl -L --fail --retry 3 \
            'https://resource2.heygen.ai/text_to_speech/1a80055e3262483f8e490f40e506eb55/00e3d285aba44b27a83c47c02c9c2d9c/id=5473be93-71b2-4912-9989-bea675fc5b40.wav' \
            -o voice.wav

      - name: Replace only the voice track
        run: |
          ffmpeg -y \
            -i source.mp4 \
            -i voice.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -af "loudnorm=I=-16:TP=-1.5:LRA=7,apad=pad_dur=1" \
            -shortest \
            project005-final-clean-voice.mp4

          ffprobe -v error \
            -show_entries format=duration:stream=index,codec_type,codec_name,width,height,sample_rate,channels \
            -of json project005-final-clean-voice.mp4 > verification.json
          cat verification.json

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: project005-final-clean-voice
          path: |
            project005-final-clean-voice.mp4
            verification.json
          if-no-files-found: error
          retention-days: 30
