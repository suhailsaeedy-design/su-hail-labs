<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Ordering Dashboard — Suhail Labs</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icons/favicon.svg" /><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#07111f;color:#f5f8ff}.app{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr}.shop,.ops{padding:28px}.shop{background:radial-gradient(circle at 0 0,#12324d 0,transparent 35%),#091522}.ops{background:#0b1728;border-left:1px solid #203248}h1,h2,h3,p{margin-top:0}.muted{color:#9cafc4}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;margin-right:auto}.pill,.btn,input{border:1px solid #294159;border-radius:12px;background:#0d1d30;color:#fff;padding:10px 12px}.btn{cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(135deg,#6fe7ff,#7a9cff);color:#07111f;border:0}.search{width:100%;margin:18px 0}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.pill{cursor:pointer;font-size:12px}.pill.active{background:#6fe7ff;color:#07111f}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item,.cart,.order,.stat{border:1px solid #203248;background:#0d1d30;border-radius:16px;padding:15px}.item{display:flex;justify-content:space-between;gap:12px}.item small{color:#9cafc4}.price{font-weight:900;color:#6fe7ff}.cart{margin-top:18px}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #203248}.qty{display:flex;gap:5px;align-items:center}.qty button{width:28px;height:28px;border:1px solid #294159;background:#13253a;color:#fff;border-radius:8px}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin:14px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stat strong{display:block;font-size:24px}.stat span{font-size:10px;color:#9cafc4}.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.lane{min-height:300px}.lane h3{font-size:13px;color:#9cafc4}.order{margin-bottom:9px}.order b{display:block}.order small{color:#9cafc4}.order button{width:100%;margin-top:9px}.flash{animation:flash .6s}@keyframes flash{50%{box-shadow:0 0 0 2px #6fe7ff}}@media(max-width:1000px){.app{grid-template-columns:1fr}.ops{border-left:0;border-top:1px solid #203248}.lanes{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.menu,.metrics,.lanes{grid-template-columns:1fr}.shop,.ops{padding:18px}}</style></head><body><main class="app">
<section class="shop"><div class="bar"><div class="brand">Suhail Labs • Smart Order</div><a class="btn" href="../../index.html">Portfolio</a></div><h1 style="margin-top:24px">Customer Ordering</h1><p class="muted">Choose items, build a cart, then send the order into the live kitchen workflow.</p><input class="search" id="search" placeholder="Search menu…"><div class="cats" id="cats"></div><div class="menu" id="menu"></div><section class="cart"><h2>Your cart</h2><div id="cart"></div><div class="total"><span>Total</span><span id="total">$0.00</span></div><div class="bar"><input id="name" placeholder="Customer name"><input id="table" placeholder="Table / pickup"><button class="btn primary" id="checkout">Send order →</button></div></section></section>
<section class="ops"><div class="bar"><div><h2>Kitchen Operations</h2><p class="muted">Live demo workflow</p></div><button class="btn" id="demo">Add demo order</button></div><div class="metrics" id="metrics"></div><div class="lanes" id="lanes"></div></section>
</main><script>
const items=[['Burger','Meals',8.5],['Chicken Bowl','Meals',10],['Pasta','Meals',9.5],['Caesar Salad','Fresh',6.5],['Fries','Sides',3.5],['Soup','Sides',4],['Coffee','Drinks',2.5],['Lemonade','Drinks',3],['Cheesecake','Dessert',5],['Brownie','Dessert',4.5]].map((x,i)=>({id:i+1,name:x[0],cat:x[1],price:x[2]}));
let cat='All',cart={},orders=[],seq=1001;
const qs=s=>document.querySelector(s), money=n=>'$'+n.toFixed(2);
function menu(){const q=qs('#search').value.toLowerCase();qs('#menu').innerHTML=items.filter(x=>(cat==='All'||x.cat===cat)&&x.name.toLowerCase().includes(q)).map(x=>`<article class="item"><div><b>${x.name}</b><br><small>${x.cat}</small></div><div><div class="price">${money(x.price)}</div><button class="btn" onclick="add(${x.id})">Add</button></div></article>`).join('')}
function cats(){const cs=['All',...new Set(items.map(x=>x.cat))];qs('#cats').innerHTML=cs.map(c=>`<button class="pill ${c===cat?'active':''}" onclick="cat='${c}';cats();menu()">${c}</button>`).join('')}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}
function renderCart(){const es=Object.entries(cart).filter(([,q])=>q>0);qs('#cart').innerHTML=es.length?es.map(([id,q])=>{const x=items.find(i=>i.id==id);return `<div class="cartrow"><span>${x.name}</span><div class="qty"><button onclick="change(${id},-1)">−</button><b>${q}</b><button onclick="change(${id},1)">+</button></div><b>${money(x.price*q)}</b></div>`}).join(''):'<p class="muted">Cart is empty.</p>';qs('#total').textContent=money(es.reduce((s,[id,q])=>s+items.find(i=>i.id==id).price*q,0))}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
const stages=['Incoming','Preparing','Ready','Completed'];
function addOrder(demo=false){const lines=demo?[{name:'Burger',q:2},{name:'Coffee',q:1}]:Object.entries(cart).map(([id,q])=>({name:items.find(i=>i.id==id).name,q}));if(!lines.length)return alert('Add at least one item.');orders.unshift({id:seq++,name:demo?'Demo Customer':qs('#name').value||'Guest',place:demo?'Table 4':qs('#table').value||'Pickup',stage:0,lines,total:demo?19.5:Object.entries(cart).reduce((s,[id,q])=>s+items.find(i=>i.id==id).price*q,0)});if(!demo){cart={};renderCart()}renderOps()}
function move(id){const o=orders.find(x=>x.id===id);if(o&&o.stage<3)o.stage++;renderOps()}
function renderOps(){qs('#metrics').innerHTML=stages.map((s,i)=>`<div class="stat"><strong>${orders.filter(o=>o.stage===i).length}</strong><span>${s}</span></div>`).join('');qs('#lanes').innerHTML=stages.map((s,i)=>`<section class="lane"><h3>${s.toUpperCase()}</h3>${orders.filter(o=>o.stage===i).map(o=>`<article class="order"><b>#${o.id} • ${o.name}</b><small>${o.place} • ${o.lines.map(l=>l.q+'× '+l.name).join(', ')}</small><div class="price">${money(o.total)}</div>${i<3?`<button class="btn primary" onclick="move(${o.id})">${['Start preparing','Mark ready','Complete'][i]} →</button>`:''}</article>`).join('')}</section>`).join('')}
qs('#search').addEventListener('input',menu);qs('#checkout').onclick=()=>addOrder(false);qs('#demo').onclick=()=>addOrder(true);cats();menu();renderCart();addOrder(true);renderOps();
</script></body></html>
